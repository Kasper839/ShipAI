<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8fafc" />
    <title>ShipAI | Connect server</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/i18n.js" defer></script>
    <script src="js/renderer-login.js" defer></script>
  </head>
  <body class="app-body">
    <header class="topbar">
      <a class="brand" href="index.html" aria-label="ShipAI home">
        <span class="brand-mark" aria-hidden="true">S</span>
        <span class="brand-name">ShipAI</span>
      </a>
      <span class="topbar-caption" data-i18n="infrastructure">Infrastructure operations</span>
      <label class="language-control" for="language-select"><span class="sr-only" data-i18n="language">Language</span><select id="language-select" data-i18n-aria-label="language" aria-label="Language"></select></label>
    </header>

    <main class="auth-layout">
      <section class="auth-card" aria-labelledby="connection-title">
        <div class="section-kicker" data-i18n="secure">Secure access</div>
        <h1 id="connection-title" data-i18n="connectTitle">Connect your server</h1>
        <p class="section-lead" data-i18n="connectHelp">Enter your SSH details to open a secure management session.</p>

        <form id="connection-form" class="form-stack" novalidate>
          <div class="form-field">
            <label for="profile-select" data-i18n="savedProfile">Saved server profile</label>
            <div class="profile-row">
              <select id="profile-select" class="form-select">
                <option value="" data-i18n="newConnection">New connection</option>
              </select>
              <button id="delete-profile" class="button button-secondary button-small" type="button" data-i18n="delete" disabled>Delete</button>
            </div>
            <p class="field-error" data-error-for="profile-select"></p>
          </div>

          <div class="form-field">
            <label for="profile-name" data-i18n="profileName">Profile name <span class="field-hint" data-i18n="optional">(optional)</span></label>
            <input id="profile-name" name="profileName" type="text" maxlength="80" data-i18n-placeholder="productionServer" placeholder="Production GPU server" />
          </div>

          <div class="form-field">
            <label for="host" data-i18n="host">Host or IP address</label>
            <input id="host" name="host" type="text" autocomplete="url" placeholder="server.example.com" required />
            <p class="field-error" data-error-for="host"></p>
          </div>

          <div class="form-grid">
            <div class="form-field">
              <label for="port" data-i18n="port">SSH port</label>
              <input id="port" name="port" type="number" inputmode="numeric" min="1" max="65535" value="22" required />
              <p class="field-error" data-error-for="port"></p>
            </div>
            <div class="form-field">
              <label for="username" data-i18n="username">Username</label>
              <input id="username" name="username" type="text" autocomplete="username" value="root" required />
              <p class="field-error" data-error-for="username"></p>
            </div>
          </div>

          <div class="form-field">
            <label for="password" data-i18n="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" data-i18n-placeholder="sshPasswordPlaceholder" placeholder="Enter your SSH password" />
            <p class="field-error" data-error-for="password"></p>
          </div>

          <div class="form-field">
            <label for="auth-type" data-i18n="authMethod">Authentication method</label>
            <select id="auth-type" class="form-select">
              <option value="password" data-i18n="sshPassword">SSH password</option>
              <option value="key" data-i18n="privateKey">Private key file</option>
            </select>
          </div>

          <div id="key-field" class="form-field" hidden>
            <label for="key-path" data-i18n="privateKeyPath">Private key path</label>
            <input id="key-path" name="keyPath" type="text" autocomplete="off" placeholder="C:\Users\you\.ssh\id_ed25519" />
            <p class="field-error" data-error-for="key-path"></p>
          </div>

          <div class="form-field">
            <label for="sudo-password" data-i18n="sudoPassword">Sudo password <span class="field-hint" data-i18n="optional">(optional)</span></label>
            <input id="sudo-password" name="sudoPassword" type="password" autocomplete="current-password" data-i18n-placeholder="defaultSudo" placeholder="Defaults to SSH password" />
            <p class="field-error" data-error-for="sudo-password"></p>
          </div>

          <p id="connection-message" class="form-message" role="status" aria-live="polite"></p>
          <label class="save-profile-control"><input id="save-profile" type="checkbox" checked /> <span data-i18n="saveProfile">Save this server profile securely on this computer</span></label>
          <button id="connect-button" class="button button-primary button-full" type="submit">
            <span class="button-text" data-i18n="connect">Connect server</span>
            <span class="button-spinner" aria-hidden="true"></span>
          </button>
        </form>

        <p class="security-note" data-i18n="security">Credentials are sent over the encrypted SSH handshake and held in memory only.</p>
      </section>
    </main>
  </body>
</html>
